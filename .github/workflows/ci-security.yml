name: CI Security

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install app deps (tests)
        working-directory: app/service
        run: |
          python -m pip install -U pip
          pip install .
          pip install pytest

      - name: Unit tests
        working-directory: app/service
        run: pytest -q

      - name: Build container
        run: docker build -t psp/service:ci app/service

      # --- SBOM ---
      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX + SPDX)
        run: |
          mkdir -p artifacts
          syft psp/service:ci -o cyclonedx-json > artifacts/sbom.cdx.json
          syft psp/service:ci -o spdx-json > artifacts/sbom.spdx.json

      - name: Install Trivy
        run: |
          wget -qO- https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.57.1_Linux-64bit.tar.gz \
            | sudo tar zx -C /usr/local/bin trivy

      - name: Trivy scan (JSON)
        run: trivy image --exit-code 0 --format json -o artifacts/trivy.json psp/service:ci

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Grype scan (JSON)
        run: grype psp/service:ci -o json > artifacts/grype.json

      # --- IaC scan ---
      - name: Install Checkov
        run: pip install checkov

      - name: Checkov (Terraform)
        run: |
          checkov -d infra/terraform --output json > artifacts/checkov.json || true

      # --- Policy gate input summarize ---
      - name: Create policy input
      # --- Start service for DAST ---
      - name: Run service container
        run: |
          docker run -d --name psp-svc -p 8080:8080 psp/service:ci
          sleep 3
          curl -fsS http://localhost:8080/healthz

      - name: OWASP ZAP Baseline (DAST)
        run: |
          mkdir -p artifacts
          docker run --rm --network host \
            -v "$(pwd)/artifacts:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -J zap.json -r zap.html || true
          # Move the ZAP outputs to our artifacts folder names
          if [ -f artifacts/zap.json ]; then
            echo "ZAP JSON present"
          fi

      - name: Stop service container
        if: always()
        run: |on
          docker rm -f psp-svc || true

      # --- Policy input summarize ---
      - name: Create policy input
        run: |
          python scripts/summarize_policy_input.py \
            --trivy artifacts/trivy.json \
            --grype artifacts/grype.json \
            --checkov artifacts/checkov.json \
            --sbom artifacts/sbom.cdx.json \
            --out artifacts/policy-input.json: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: OPA gate (informational for PRs)
        run: |
          opa eval -I -d policies/opa/build-gate.rego -i artifacts/policy-input.json "data.psp.deny" | tee artifacts/opa-deny.json
          opa eval -I -d policies/opa/build-gate.rego -i artifacts/policy-input.json "data.psp.allow" | tee artifacts/opa-allow.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-artifacts
          path: artifacts/

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3